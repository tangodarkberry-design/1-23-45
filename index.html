<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070508">
    <meta name="robots" content="noindex, nofollow">

    <title>Secured By LOXX</title>

    <!-- Everything the intro needs is public; the real site lives in site.enc, encrypted. -->
    <link rel="preload" as="image" href="HEART.svg">
    <link rel="preload" as="image" href="LOXX.svg">

    <style>

        :root {
            --bg: #070508;
            --pink: 255, 70, 120;
            --pink-text: #ffb0c5;
            --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 100%; height: 100%; }

        body {
            overflow: hidden;
            background: var(--bg);
            color: #fff;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }


        /* ---------- background ---------- */

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 40, 100, 0.10), transparent 38%),
                var(--bg);
        }

        .background::after {
            content: "";
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, rgba(255, 50, 110, 0.08), transparent 55%);
            will-change: transform, opacity;
            animation: ambientGlow 5s ease-in-out infinite;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55));
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .particles span {
            position: absolute;
            bottom: -40px;
            color: rgba(var(--pink), 0.5);
            opacity: 0;
            will-change: transform, opacity;
            animation: floatUp linear infinite;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.015) 0px,
                rgba(255, 255, 255, 0.015) 1px,
                transparent 1px,
                transparent 4px
            );
        }


        /* ---------- screens ---------- */

        .screen {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }


        /* ---------- heartbeat ---------- */

        .heart-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-glow {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 40, 100, 0.20), transparent 65%);
            filter: blur(25px);
            animation: heartGlow 1.2s ease-in-out infinite;
        }

        .heart {
            position: relative;
            width: clamp(180px, 30vw, 350px);
            height: auto;
            filter: drop-shadow(0 0 20px rgba(var(--pink), 0.35));
            will-change: transform;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .date {
            margin-top: 30px;
            font-size: clamp(0.8rem, 2vw, 1.05rem);
            letter-spacing: 3px;
            text-align: center;
            line-height: 1.6;
            color: rgba(255, 220, 230, 0.8);
            opacity: 0;
            animation: dateAppear 1s ease 0.7s forwards;
        }


        /* ---------- lock + questions ---------- */

        .loxx-screen {
            justify-content: flex-start;
            overflow-y: auto;
            background: radial-gradient(circle at center, rgba(255, 40, 100, 0.08), transparent 45%);
        }

        .loxx-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;

            /* margin:auto centres this when there is room, and lets the
               screen scroll normally when the form is taller than the phone */
            margin: auto;
            padding: 24px 0 80px;
        }

        .loxx-ring {
            position: absolute;
            top: 28px;
            width: min(430px, 75vw);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 80, 130, 0.14);
            opacity: 0;
            animation: ringAppear 0.8s ease 0.7s forwards;
            pointer-events: none;
        }

        .loxx-ring::after {
            content: "";
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 100, 150, 0.14);
            animation: rotateRing 12s linear infinite;
        }

        .lock {
            position: relative;
            z-index: 2;
            width: clamp(110px, 20vh, 250px);
            height: auto;
            transform: translateY(-120vh) rotate(-8deg) scale(0.9);
            will-change: transform;
        }

        .lock.slam {
            animation:
                lockSlam 0.85s cubic-bezier(0.16, 1.3, 0.3, 1) forwards,
                lockGlow 2.5s ease-in-out 0.85s infinite;
        }

        .lock.slam.unlocked {
            animation: lockBurst 1s ease forwards;
        }

        .loxx-container.impact {
            animation: impact 0.35s ease-out 0.55s;
        }

        .security {
            position: relative;
            z-index: 3;
            text-align: center;
            margin-top: 22px;
            opacity: 0;
            transform: translateY(15px);
        }

        .security.show {
            animation: textAppear 0.8s ease forwards;
        }

        .security-small {
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 160, 185, 0.6);
            margin-bottom: 10px;
        }

        .security-main {
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 5px;
            color: var(--pink-text);
            text-shadow: 0 0 12px rgba(var(--pink), 0.4);
        }


        /* ---------- the questions ---------- */

        .gate {
            position: relative;
            z-index: 3;
            width: min(360px, 100%);
            margin-top: 26px;
            padding: 0 4px;

            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        .gate.show {
            opacity: 1;
            transform: none;
            pointer-events: auto;
            animation: textAppear 0.8s ease backwards;
        }

        .gate.hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            animation: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .gate.shake {
            animation: shake 0.45s ease;
        }

        .gate-title {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 220, 230, 0.7);
        }

        .gate label.q {
            display: block;
            margin: 12px 0 5px;
            font-size: 0.88rem;
            line-height: 1.4;
            color: rgba(255, 220, 230, 0.85);
        }

        .gate input[type="text"] {
            width: 100%;
            padding: 12px 16px;

            border: 1px solid rgba(255, 150, 180, 0.22);
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.05);
            color: #fff;

            font: inherit;
            font-size: 1rem;           /* 16px stops iPhones zooming in */

            outline: none;

            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .gate input[type="text"]:focus {
            border-color: rgba(255, 130, 170, 0.7);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 70, 130, 0.15);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: rgba(255, 220, 230, 0.6);
            cursor: pointer;
        }

        .remember input {
            accent-color: #ff6f9c;
            width: 16px;
            height: 16px;
        }

        .gate-error {
            min-height: 1.5em;
            margin-top: 14px;
            text-align: center;
            font-size: 0.85rem;
            color: #ff9fb6;
        }

        .unlock {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 14px 32px;

            border: none;
            border-radius: 50px;

            background: linear-gradient(135deg, #ff6f9c, #ff477d);
            color: #fff;

            font: inherit;
            font-weight: 600;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(255, 60, 110, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.25);

            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
        }

        .unlock:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(255, 60, 110, 0.4);
        }

        .unlock:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        .unlock:focus-visible,
        .skip:focus-visible,
        .remember input:focus-visible {
            outline: 2px solid var(--pink-text);
            outline-offset: 3px;
        }


        /* ---------- skip intro ---------- */

        .skip {
            position: fixed;
            bottom: max(22px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;

            padding: 8px 18px;

            border: 1px solid rgba(255, 150, 180, 0.18);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 220, 230, 0.55);

            font: inherit;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;

            cursor: pointer;

            opacity: 0;
            animation: textAppear 0.8s ease 1.5s forwards;

            transition: color 0.3s, border-color 0.3s, background 0.3s;
        }

        .skip:hover {
            color: #fff;
            border-color: rgba(255, 150, 180, 0.5);
            background: rgba(255, 70, 130, 0.15);
        }

        .skip.gone {
            display: none;
        }


        /* ---------- exit ---------- */

        .fade {
            animation: fadeOut 1s ease forwards;
        }


        /* ---------- animations ---------- */

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15%      { transform: scale(1.10); }
            30%      { transform: scale(1); }
            45%      { transform: scale(1.10); }
            60%      { transform: scale(1); }
        }

        @keyframes heartGlow {
            0%, 100% { transform: scale(0.8);  opacity: 0.4; }
            50%      { transform: scale(1.15); opacity: 0.9; }
        }

        @keyframes dateAppear {
            from { opacity: 0;    transform: translateY(15px); }
            to   { opacity: 0.85; transform: translateY(0); }
        }

        @keyframes ambientGlow {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50%      { transform: scale(1.1); opacity: 1; }
        }

        @keyframes lockSlam {
            0%   { transform: translateY(-120vh) rotate(-8deg) scale(0.9); }
            65%  { transform: translateY(25px) rotate(2deg) scale(1.03); }
            78%  { transform: translateY(-10px) rotate(-1deg) scale(1); }
            90%  { transform: translateY(4px) rotate(0deg) scale(1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        @keyframes lockGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 70, 130, 0.2)); }
            50%      { filter: drop-shadow(0 0 65px rgba(255, 70, 130, 0.65)); }
        }

        @keyframes lockBurst {
            0%   { transform: scale(1);    filter: drop-shadow(0 0 30px rgba(255, 70, 130, 0.4)); }
            40%  { transform: scale(1.14); filter: drop-shadow(0 0 110px rgba(255, 90, 150, 1)); }
            100% { transform: scale(1);    filter: drop-shadow(0 0 70px rgba(255, 70, 130, 0.7)); }
        }

        @keyframes impact {
            0%, 100% { transform: translate(0, 0); }
            25%      { transform: translate(-4px, 3px); }
            50%      { transform: translate(4px, -3px); }
            75%      { transform: translate(-2px, 2px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-5px); }
            80%      { transform: translateX(5px); }
        }

        @keyframes ringAppear {
            from { opacity: 0; transform: scale(0.7); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes textAppear {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0; transform: scale(1.04); }
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            15%  { opacity: 0.6; }
            85%  { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
        }


        /* ---------- reduced motion ---------- */

        @media (prefers-reduced-motion: reduce) {

            .particles,
            .scanlines {
                display: none;
            }

            .heart,
            .heart-glow,
            .background::after,
            .loxx-ring::after,
            .lock.slam,
            .lock.slam.unlocked,
            .loxx-container.impact,
            .gate.shake {
                animation: none;
            }

            .lock {
                transform: none;
                opacity: 0;
                transition: opacity 0.6s ease;
            }

            .lock.slam {
                opacity: 1;
            }
        }

    </style>

</head>


<body>

    <div class="background"></div>
    <div class="vignette"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>


    <!-- HEARTBEAT -->

    <main class="screen active" id="heartbeat">

        <div class="heart-container">
            <div class="heart-glow"></div>
            <img class="heart" src="HEART.svg" alt="A beating heart" decoding="async">
        </div>

        <p class="date" id="introLine"></p>

    </main>


    <!-- LOCK + QUESTIONS -->

    <section class="screen loxx-screen" id="loxxScreen">

        <div class="loxx-container" id="loxxContainer">

            <div class="loxx-ring"></div>

            <img class="lock" id="lock" src="LOXX.svg" alt="A lock" decoding="async">

            <div class="security" id="security" aria-live="polite">
                <p class="security-small">LOXX Security System</p>
                <p class="security-main" id="securityMain">Secured By LOXX ♥</p>
            </div>

            <form class="gate" id="gate" autocomplete="off" novalidate>

                <p class="gate-title">Only we know these ♥</p>

                <div id="fields"></div>

                <label class="remember">
                    <input type="checkbox" id="remember">
                    Keep me unlocked on this device
                </label>

                <p class="gate-error" id="gateError" role="alert"></p>

                <button class="unlock" id="unlockButton" type="submit">Unlock</button>

            </form>

        </div>

    </section>


    <button class="skip" id="skip" type="button">Skip intro</button>


    <script>

        (() => {

            /* Filled in by build.mjs. Contains the questions (never the answers). */
            const CONFIG = {"iterations":600000,"entry":"home.html","intro":"August 9th 2026 — the day we got together","questions":["Where did we meet?","How did you meet solvi?","What platform do we use to communicate? (messaging service)","What game do we always play?"]};

            const STORAGE_KEY = "loxx-key";


            /* =====================================================
               CRYPTO + PAGE REBUILDING
               (build.mjs uses the exact same normalising rules)
            ===================================================== */

            /*CRYPTO_START*/

            // Spaces, capitals, accents and punctuation never matter.
            function normalizeAnswer(text) {
                return String(text)
                    .normalize("NFKD")
                    .replace(/[̀-ͯ]/g, "")
                    .toLowerCase()
                    .replace(/[^\p{L}\p{N}]+/gu, "");
            }

            function secretFrom(answers) {
                return answers.map(normalizeAnswer).join("|");
            }

            async function deriveKey(secret, salt, iterations, extractable) {

                const material = await crypto.subtle.importKey(
                    "raw",
                    new TextEncoder().encode(secret),
                    "PBKDF2",
                    false,
                    ["deriveKey"]
                );

                return crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
                    material,
                    { name: "AES-GCM", length: 256 },
                    !!extractable,
                    ["decrypt"]
                );
            }

            // File layout: salt (16) | iv (12) | AES-GCM ciphertext (gzip of the packed files)
            async function decryptBundle(bytes, key) {

                const iv = bytes.slice(16, 28);

                const plain = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv },
                    key,
                    bytes.slice(28)
                );

                const raw = await new Response(
                    new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))
                ).arrayBuffer();

                const headerLength = new DataView(raw).getUint32(0);

                const header = JSON.parse(
                    new TextDecoder().decode(new Uint8Array(raw, 4, headerLength))
                );

                const files = {};
                let offset = 4 + headerLength;

                for (const file of header.files) {
                    files[file.path] = {
                        type: file.type,
                        bytes: new Uint8Array(raw, offset, file.size)
                    };
                    offset += file.size;
                }

                return files;
            }

            // Points every reference to a bundled file (src="photos/a.jpg",
            // url(style.css), ...) at its in-memory copy instead.
            function rewriteRefs(text, urlMap) {

                const names = [];

                for (const path of Object.keys(urlMap)) {
                    names.push(path);
                    const encoded = encodeURI(path);
                    if (encoded !== path) { urlMap[encoded] = urlMap[path]; names.push(encoded); }
                }

                if (!names.length) return text;

                names.sort((a, b) => b.length - a.length);

                const escaped = names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");

                const pattern = new RegExp(
                    "([\"'(=\\s,])(?:\\.\\/)?(" + escaped + ")(?=[\"')\\s>?#,;])",
                    "g"
                );

                return text.replace(pattern, (match, before, path) => before + urlMap[path]);
            }

            // Turns the decrypted files into one ready-to-show HTML string.
            function buildPage(files, entry, makeUrl) {

                const urls = {};
                const kind = (path) => (/\.(css|m?js)$/i.test(path) ? "code" : /\.html?$/i.test(path) ? "html" : "asset");
                const text = (file) => new TextDecoder().decode(file.bytes);

                // 1. images, audio, fonts...
                for (const [path, file] of Object.entries(files)) {
                    if (kind(path) === "asset") urls[path] = makeUrl(file.bytes, file.type);
                }

                // 2. stylesheets and scripts (they can point at the assets)
                for (const [path, file] of Object.entries(files)) {
                    if (kind(path) === "code") {
                        urls[path] = makeUrl(new TextEncoder().encode(rewriteRefs(text(file), urls)), file.type);
                    }
                }

                // 3. the page itself
                if (!files[entry]) throw new Error("Missing " + entry);

                return rewriteRefs(text(files[entry]), urls);
            }

            /*CRYPTO_END*/


            /* =====================================================
               ELEMENTS
            ===================================================== */

            const $ = (id) => document.getElementById(id);

            const heartbeat = $("heartbeat");
            const loxxScreen = $("loxxScreen");
            const loxxContainer = $("loxxContainer");
            const lock = $("lock");
            const security = $("security");
            const securityMain = $("securityMain");
            const gate = $("gate");
            const fields = $("fields");
            const remember = $("remember");
            const gateError = $("gateError");
            const unlockButton = $("unlockButton");
            const skip = $("skip");
            const particles = $("particles");

            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            if (CONFIG.intro) {
                $("introLine").textContent = CONFIG.intro;
            } else {
                $("introLine").remove();
            }


            /* =====================================================
               START DOWNLOADING THE SITE IMMEDIATELY
               It downloads while the intro plays.
            ===================================================== */

            let bundlePromise = null;

            function getBundle() {

                if (!bundlePromise) {
                    bundlePromise = fetch("site.enc", { cache: "no-cache" })
                        .then((response) => {
                            if (!response.ok) throw new Error("download failed");
                            return response.arrayBuffer();
                        })
                        .then((buffer) => new Uint8Array(buffer))
                        .catch((error) => { bundlePromise = null; throw error; });
                }

                return bundlePromise;
            }

            getBundle().catch(() => {});


            /* =====================================================
               BUILD THE QUESTION FIELDS
            ===================================================== */

            CONFIG.questions.forEach((question, index) => {

                const label = document.createElement("label");
                label.className = "q";
                label.htmlFor = "q" + index;
                label.textContent = question;

                const input = document.createElement("input");
                input.type = "text";
                input.id = "q" + index;
                input.autocomplete = "off";
                input.autocapitalize = "off";
                input.setAttribute("autocorrect", "off");
                input.spellcheck = false;
                input.enterKeyHint = index === CONFIG.questions.length - 1 ? "go" : "next";

                fields.append(label, input);
            });


            /* =====================================================
               FLOATING HEARTS
            ===================================================== */

            if (!reduceMotion) {

                const count = window.innerWidth < 700 ? 10 : 18;

                for (let i = 0; i < count; i++) {

                    const heart = document.createElement("span");

                    heart.textContent = Math.random() > 0.5 ? "♡" : "♥";
                    heart.style.left = Math.random() * 100 + "%";
                    heart.style.fontSize = 10 + Math.random() * 18 + "px";
                    heart.style.animationDuration = 9 + Math.random() * 9 + "s";
                    heart.style.animationDelay = -Math.random() * 12 + "s";

                    particles.appendChild(heart);
                }
            }


            /* =====================================================
               INTRO SEQUENCE (milliseconds)
            ===================================================== */

            const T = reduceMotion
                ? { fadeHeart: 2500, showLock: 3200, lockDelay: 0,   text: 3600, gate: 4200 }
                : { fadeHeart: 4000, showLock: 5000, lockDelay: 100, text: 5850, gate: 7000 };

            const timers = [];
            const at = (ms, fn) => timers.push(setTimeout(fn, ms));

            let lockShown = false;

            function showLock() {

                if (lockShown) return;
                lockShown = true;

                skip.classList.add("gone");

                heartbeat.classList.remove("active", "fade");
                loxxScreen.classList.add("active");

                at(T.lockDelay, () => {
                    lock.classList.add("slam");
                    loxxContainer.classList.add("impact");
                });
            }

            const showText = () => security.classList.add("show");

            at(T.fadeHeart, () => heartbeat.classList.add("fade"));
            at(T.showLock, showLock);
            at(T.text, showText);
            at(T.gate, openGate);

            skip.addEventListener("click", () => {

                timers.forEach(clearTimeout);
                timers.length = 0;

                showLock();

                at(900, showText);
                at(1500, openGate);
            });


            /* =====================================================
               THE QUESTIONS
            ===================================================== */

            let gateOpen = false;
            let busy = false;

            async function openGate() {

                if (gateOpen) return;
                gateOpen = true;

                // Already unlocked on this device? Try the saved key first.
                try {

                    const saved = localStorage.getItem(STORAGE_KEY);

                    if (saved) {

                        const raw = Uint8Array.from(atob(saved), (c) => c.charCodeAt(0));

                        const key = await crypto.subtle.importKey(
                            "raw", raw, { name: "AES-GCM" }, false, ["decrypt"]
                        );

                        const files = await decryptBundle(await getBundle(), key);

                        return succeed(files);
                    }

                } catch (error) {
                    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                }

                gate.classList.add("show");

                const first = fields.querySelector("input");

                if (first && window.innerWidth > 700) first.focus({ preventScroll: true });
            }

            function setError(message) {
                gateError.textContent = message;
            }

            gate.addEventListener("submit", async (event) => {

                event.preventDefault();

                if (busy) return;

                const answers = [...fields.querySelectorAll("input")].map((input) => input.value);

                if (answers.some((answer) => !normalizeAnswer(answer))) {
                    setError("Please answer every question ♥");
                    return;
                }

                busy = true;
                unlockButton.disabled = true;
                unlockButton.textContent = "Unlocking…";
                setError("");

                let bytes;

                try {
                    bytes = await getBundle();
                } catch (error) {
                    setError("Couldn't load the site. Check your connection and try again.");
                    return reset();
                }

                try {

                    const key = await deriveKey(
                        secretFrom(answers),
                        bytes.slice(0, 16),
                        CONFIG.iterations,
                        remember.checked
                    );

                    const files = await decryptBundle(bytes, key);

                    if (remember.checked) {
                        try {
                            const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
                            localStorage.setItem(STORAGE_KEY, btoa(String.fromCharCode(...raw)));
                        } catch (e) {}
                    }

                    succeed(files);

                } catch (error) {

                    setError("Not quite, try again ♥");

                    gate.classList.remove("shake");
                    void gate.offsetWidth;
                    gate.classList.add("shake");

                    reset();
                }
            });

            function reset() {
                busy = false;
                unlockButton.disabled = false;
                unlockButton.textContent = "Unlock";
            }


            /* =====================================================
               UNLOCKED
            ===================================================== */

            function succeed(files) {

                gate.classList.remove("show");
                gate.classList.add("hidden");

                lock.classList.add("slam", "unlocked");
                securityMain.textContent = "Unlocked ♥";
                security.classList.add("show");

                setTimeout(() => loxxScreen.classList.add("fade"), reduceMotion ? 600 : 1300);

                setTimeout(() => showSite(files), reduceMotion ? 1200 : 2300);
            }

            function showSite(files) {

                const html = buildPage(
                    files,
                    CONFIG.entry,
                    (bytes, type) => URL.createObjectURL(new Blob([bytes], { type }))
                );

                document.open();
                document.write(html);
                document.close();
            }

        })();

    </script>

</body>
